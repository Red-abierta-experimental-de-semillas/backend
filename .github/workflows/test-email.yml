name: Test Brevo SMTP email

on:
  workflow_dispatch:
    inputs:
      to:
        description: "Recipient email"
        required: true
        default: "jorge.cortesglez@gmail.com"

jobs:
  send_test_email:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install functions dependencies
        run: npm ci
        working-directory: functions
      - name: Send SMTP test email
        working-directory: functions
        env:
          SMTP_HOST: smtp-relay.brevo.com
          SMTP_PORT: "587"
          SMTP_SECURE: "false"
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
          TEST_TO: ${{ inputs.to }}
        run: |
          node <<'NODE'
          const nodemailer = require('nodemailer')

          const required = ['SMTP_USER', 'SMTP_PASS', 'SMTP_FROM', 'TEST_TO']
          for (const key of required) {
            if (!process.env[key]) {
              throw new Error(`Missing required env var/secret: ${key}`)
            }
          }

          const transporter = nodemailer.createTransport({
            host: process.env.SMTP_HOST,
            port: Number(process.env.SMTP_PORT),
            secure: process.env.SMTP_SECURE === 'true',
            auth: {
              user: process.env.SMTP_USER,
              pass: process.env.SMTP_PASS,
            },
          })

          async function main() {
            const info = await transporter.sendMail({
              from: process.env.SMTP_FROM,
              to: process.env.TEST_TO,
              subject: 'Prueba SMTP Brevo - Red Abierta Experimental de Semillas',
              text: 'Prueba de envío SMTP desde GitHub Actions. Si recibes esto, Brevo SMTP está funcionando.',
              html: '<p>Prueba de envío SMTP desde GitHub Actions.</p><p>Si recibes esto, <strong>Brevo SMTP está funcionando</strong>.</p>',
            })
            console.log(`Message sent: ${info.messageId || 'ok'}`)
          }

          main().catch(error => {
            console.error(error)
            process.exit(1)
          })
          NODE
